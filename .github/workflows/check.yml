# One runner, one image pull: the render diff, the tests and the lint.
name: check
on: {pull_request: {}}
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: katoptra/lib/.github/actions/toolbox@04f7901cf1aa7551bc43db5ff801a225a189c42a # v1.0.2
      - run: task check
      - run: task test
      - run: task lint
