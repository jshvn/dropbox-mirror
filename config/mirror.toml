# The one behavior input. Runtime paths, secrets and the account identifiers
# (MIRROR_DROPBOX_ACCOUNT_ID, MIRROR_PROTON_DESTINATION, MIRROR_PROTON_DESTINATION_UID)
# come from the environment; see op.env.
[mirror]
id = "dropbox-mirror"

[dropbox]
root = ""
page_limit = 2000
minimum_call_interval_seconds = 0.1
download_workers = 4

[budget]
batch_gb = 4
# Measured: 1,000 files uploaded in about 650 s, about 0.65 s per file. 2,000 files
# costs roughly 22 minutes of the 165-minute run_budget_minutes, leaving room for
# several batches a run.
batch_files = 2000
# A file over this is left out of every plan: a GitHub runner guarantees 14 GB of
# disk, the staging of one file needs the file plus disk_headroom_gb, and the state
# and image share the same disk. The report counts what was left out.
max_file_gb = 12
run_budget_minutes = 165
ceiling_gb = 4000
disk_headroom_gb = 1
listing_floor_ratio = 0.5

[reconcile]
weekday = 0
