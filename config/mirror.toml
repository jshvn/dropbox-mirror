[budget]
# Seed values. One CLI invocation uploads a whole batch and reports nothing until it
# ends, so a batch is also the unit a stalled upload costs: keep batches small until the
# first nights' throughput rows say the account sustains more. Raise batch_gb toward 4 then.
batch_gb = 1
# ponytail: the round-trip downloads one file per CLI process, seconds each, so a batch
# is bounded by its file count as much as by its bytes. 250 files fit the 165 min budget
# while the measured cost stays under about 36 s per file (README, first-run checks);
# past that the round-trip defers the rest of the batch and the next run re-plans it. The
# upgrade path is a recursive folder download when a batch covers a whole folder.
batch_files = 250
run_budget_minutes = 165
ceiling_gb = 4000
disk_headroom_gb = 1
listing_floor_ratio = 0.5

[reconcile]
weekday = 0
