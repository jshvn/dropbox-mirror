# dropbox: nightly Dropbox -> Proton Drive mirror run from GitHub Actions.
#
# Invariant: every step runs inside the toolbox image, on a laptop and in CI
# alike, and R2 holds the only record of how far the mirror has got. Secrets
# reach processes by name from 1Password (op.env); nothing is written to disk.
#
# The toolbox, which starts a run, contains it in the image, resolves its secrets,
# renders and checks it and reports it, is katoptra/lib's, included below at v1 and
# flattened into this file. What is here is the mirror's own: the pipeline in order,
# one migrator command a step, the operator verbs around it, and its part of the
# report. The migrator keeps its own clock and its own pings, so those three verbs
# are excluded from the include and defined here.
version: '3'

vars:
  RUN_EPOCH:
    sh: date +%s

# Run-scoped environment for every migrator command. RECONCILE and RUN_BUDGET_MIN are
# task vars a run sets after the double dash (task sync -- RECONCILE=true
# RUN_BUDGET_MIN=30, or the workflow's vars input), mapped to the names the migrator
# reads; unset, they render empty, which it reads as unset. AWS_REGION is an ENV line
# in the image, so every in-toolbox command sees it.
env:
  MIRROR_RUN_EPOCH: '{{.RUN_EPOCH}}'
  MIRROR_WORK_DIR: .run
  MIRROR_CONFIG: config/mirror.toml
  RECONCILE: '{{.RECONCILE | default ""}}'
  RUN_BUDGET_MIN: '{{.RUN_BUDGET_MIN | default ""}}'
  PROTON_DRIVE_LOG_LEVEL: INFO   # the Proton CLI's own log level; its lines reach the public job log

includes:
  toolbox:
    taskfile: https://raw.githubusercontent.com/katoptra/lib/v1/toolbox.yml
    flatten: true
    excludes: [clock, ping, ping-fail, report-mirror]
    vars:
      NAME: dropbox
      DESC: nightly Dropbox -> Proton Drive mirror; R2 holds the state
      IMAGE: ghcr.io/katoptra/toolbox:proton-v1
      PASS: MIRROR_VERBOSE
      MENU: >-
        ""
        "${c}read -- looks at Dropbox, Proton and R2, changes nothing${r}"
        "  task status               Counts and the last run's figures from the state in R2"
        ""
        "${c}checks -- offline, no credentials${r}"
        "  task test                 pytest inside the toolbox"
        "  task lint                 ruff check + format check"
        "  task fmt                  ruff format"
        ""
        "${c}write -- changes Proton Drive and the state in R2${r}"
        "  task sync -- RUN_BUDGET_MIN=30 RECONCILE=true"
        "                            ${d}a shorter budget; a forced Proton walk (the literal word true)${r}"
        "  task empty-trash          Permanently delete Proton trash (never scheduled)"
        "  task state-rollback -- k  Copy a history object over the canonical state"
        "                            ${d}with no key it lists the history${r}"
        "  task session-seal -- dir  Encrypt a laptop Proton CLI session into R2"

tasks:
  # ---- pipeline (runs inside the toolbox; each step is one migrator command) ----
  pipeline:
    desc: The full budgeted run, inside the toolbox
    cmds:
      - task: clock
      - task: session
      - task: state
      - task: inventory
      - task: delta
      - task: plan-phase
      - task: batches
      - task: trash
      - task: reconcile
      - task: report-phase
      - task: report
      - task: ping

  plan-pipeline:
    desc: Read-only half of the pipeline, inside the toolbox; prints the report it would make
    cmds:
      - task: clock
      - task: session
      - task: state
      - task: inventory
      - task: delta
      - task: plan-phase
      - python -m migrator report   # no --apply: a read-only plan pushes nothing to R2
      - cat .run/report.md

  clock:
    internal: true
    cmds:
      - python -m migrator clock
      - date -u '+%s %H %u' > .run/start.txt   # the toolbox's report reads it for its Started row
  session:    { internal: true, cmds: ['python -m migrator session'] }
  state:      { internal: true, cmds: ['python -m migrator state'] }
  inventory:  { internal: true, cmds: ['python -m migrator inventory'] }
  delta:      { internal: true, cmds: ['python -m migrator delta'] }
  plan-phase: { internal: true, cmds: ['python -m migrator plan'] }
  batches:    { internal: true, cmds: ['python -m migrator --apply batches'] }
  trash:      { internal: true, cmds: ['python -m migrator --apply trash'] }
  reconcile:  { internal: true, cmds: ['python -m migrator --apply reconcile'] }
  # Builds .run/report.md from the state, closes the run row, writes the chain marker.
  report-phase: { internal: true, cmds: ['python -m migrator --apply report'] }
  ping:         { internal: true, cmds: ['python -m migrator ping'] }
  # Not internal: the toolbox's sync runs it from the command line after a failed pipeline.
  ping-fail:    { cmds: ['python -m migrator ping fail'] }
  empty-trash-pipeline:
    internal: true
    cmds:
      - task: clock
      - task: session
      - task: state
      - python -m migrator --apply empty-trash

  # The toolbox's report calls this after its own rows: at the end of the pipeline, and
  # from sync's failure path after one that died anywhere. A run that died before its
  # report phase gets one now, closing the run row; then the report goes on the job page
  # under the toolbox's rows.
  report-mirror:
    internal: true
    cmds:
      - test -f .run/report.md || python -m migrator --apply report || true
      - test ! -f .run/report.md || cat .run/report.md >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"

  # ---- read ----
  status:
    desc: Counts from the state in R2
    cmds:
      - task: op
        vars: { ARGS: python -m migrator status }

  # ---- checks ----
  test:
    desc: Run the test suite inside the toolbox
    cmds:
      - task run -- python -m pytest {{.CLI_ARGS}}

  lint:
    desc: ruff check and format check
    cmds:
      - task run -- sh -c 'ruff check src tests && ruff format --check src tests'

  fmt:
    desc: ruff format
    cmds:
      - task run -- ruff format src tests

  # ---- write ----
  empty-trash:
    desc: Permanently delete Proton trash
    prompt: This permanently deletes everything in Proton Drive trash. Continue?
    cmds:
      - task: op
        vars: { ARGS: task empty-trash-pipeline }

  state-rollback:
    desc: 'Copy a history object over the canonical state: task state-rollback -- <key>'
    cmds:
      - task: op
        vars: { ARGS: 'python -m migrator state-rollback {{.CLI_ARGS}}' }

  session-seal:
    desc: 'Encrypt a laptop Proton CLI session into R2: task session-seal -- <cache dir>'
    cmds:
      - task: op
        vars: { ARGS: 'python -m migrator session-seal {{.CLI_ARGS}}' }
